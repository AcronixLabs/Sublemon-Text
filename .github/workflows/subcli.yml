name: Subcli

on:
  push:
    branches: [main]
    paths:
      - 'subcli/**'
      - 'packaging/subcli/**'
      - '.github/workflows/subcli.yml'
  pull_request:
    paths:
      - 'subcli/**'
      - 'packaging/subcli/**'
      - '.github/workflows/subcli.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Test subcli
        run: ./subcli/test.sh

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel neovim
      - name: Build Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/subcli/arch' && makepkg --noconfirm --cleanbuild"
      - uses: actions/upload-artifact@v4
        with:
          name: subcli-arch-any
          path: 'packaging/subcli/arch/*.pkg.tar.zst'
          if-no-files-found: error

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim zip
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build staging tree
        run: |
          stage=dist/subcli-stage
          mkdir -p "$stage/usr/bin" "$stage/usr/share/subcli" "$stage/usr/share/doc/subcli" "$stage/usr/share/licenses/subcli"
          cp subcli/init.lua "$stage/usr/share/subcli/init.lua"
          cp -R subcli/lua "$stage/usr/share/subcli/lua"
          cp subcli/README.md "$stage/usr/share/doc/subcli/README.md"
          cp LICENSE "$stage/usr/share/licenses/subcli/LICENSE"
          cp subcli/bin/subcli "$stage/usr/bin/subcli"
          chmod 755 "$stage/usr/bin/subcli"
      - name: Build Debian and RPM packages
        run: |
          export PATH="$HOME/go/bin:$PATH"
          cd packaging/subcli
          nfpm package --config nfpm-deb.yaml --packager deb --target ../../dist/
          nfpm package --config nfpm-rpm.yaml --packager rpm --target ../../dist/
      - name: Build portable archives
        run: |
          mkdir -p dist/unix/subcli/bin dist/windows/subcli/bin
          cp subcli/init.lua subcli/README.md dist/unix/subcli/
          cp -R subcli/lua dist/unix/subcli/lua
          cp subcli/bin/subcli dist/unix/subcli/bin/subcli
          cp subcli/init.lua subcli/README.md dist/windows/subcli/
          cp -R subcli/lua dist/windows/subcli/lua
          cp subcli/bin/subcli.cmd dist/windows/subcli/bin/subcli.cmd
          tar -C dist/unix -czf dist/subcli-unix.tar.gz subcli
          (cd dist/windows && zip -r ../subcli-windows.zip subcli)
      - uses: actions/upload-artifact@v4
        with:
          name: subcli-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/subcli-unix.tar.gz
            dist/subcli-windows.zip
          if-no-files-found: error

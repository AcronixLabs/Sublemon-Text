name: Release builds

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel rust gtk3 libxkbcommon wayland libx11 libxcb libxrandr libxcursor libxi mesa
      - name: Build Arch package
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cp /etc/makepkg.conf /tmp/sublemon-makepkg.conf
          printf '\nBUILDDIR=/tmp/sublemon-makepkg-build\n' >> /tmp/sublemon-makepkg.conf
          mkdir -p /tmp/sublemon-makepkg-build
          chown -R builder:builder /tmp/sublemon-makepkg-build
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --config /tmp/sublemon-makepkg.conf --noconfirm --syncdeps --cleanbuild"
      - uses: actions/upload-artifact@v4
        with:
          name: sublemon-arch-x86_64
          path: 'packaging/arch/*.pkg.tar.zst'
          if-no-files-found: error

  deb-rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxcursor-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libdbus-1-dev libasound2-dev pkg-config
      - name: Build release binaries
        run: cargo build --release --locked --bins
      - name: Build Debian package
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --no-strip
      - name: Build RPM package
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: sublemon-debian-rpm-x86_64
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release binaries
        run: cargo build --release --locked --bins
      - name: Assemble Windows archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/sublemon | Out-Null
          Copy-Item target/release/sublemon.exe, target/release/sublemon-lsp.exe, LICENSE, README.md, THIRD_PARTY_NOTICES.md, icon.png dist/sublemon/
          Compress-Archive -Path dist/sublemon -DestinationPath dist/sublemon-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sublemon-windows-x86_64
          path: |
            target/release/sublemon.exe
            target/release/sublemon-lsp.exe
            dist/sublemon-windows-x86_64.zip
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal macOS app and unsigned DMG
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cargo build --release --locked --bins --target aarch64-apple-darwin
          cargo build --release --locked --bins --target x86_64-apple-darwin

          APP='dist/Sublemon.app'
          CONTENTS="$APP/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources" dist/dmg
          lipo -create \
            target/aarch64-apple-darwin/release/sublemon \
            target/x86_64-apple-darwin/release/sublemon \
            -output "$CONTENTS/MacOS/sublemon"
          lipo -create \
            target/aarch64-apple-darwin/release/sublemon-lsp \
            target/x86_64-apple-darwin/release/sublemon-lsp \
            -output "$CONTENTS/MacOS/sublemon-lsp"
          chmod 755 "$CONTENTS/MacOS/sublemon" "$CONTENTS/MacOS/sublemon-lsp"

          ICONSET="$RUNNER_TEMP/sublemon.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256; do
            sips -z "$size" "$size" icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          sips -z 512 512 icon.png --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 icon.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$CONTENTS/Resources/sublemon.icns"

          cat > "$CONTENTS/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>sublemon</string>
            <key>CFBundleIconFile</key><string>sublemon</string>
            <key>CFBundleIdentifier</key><string>com.acronixlabs.sublemon</string>
            <key>CFBundleName</key><string>Sublemon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.01</string>
            <key>CFBundleVersion</key><string>0.01</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$CONTENTS/Info.plist"

          cp -R "$APP" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname 'Sublemon 0.01' -srcfolder dist/dmg \
            -ov -format UDZO dist/Sublemon-0.01-universal-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: sublemon-macos-universal-unsigned
          path: dist/Sublemon-0.01-universal-unsigned.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, deb-rpm, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release and attach packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find dist -type f \( -name '*.deb' -o -name '*.pkg.tar.zst' -o -name '*.rpm' -o -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -print | sort)
          if (( ${#assets[@]} == 0 )); then
            echo 'No release assets were produced.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Sublemon ${GITHUB_REF_NAME#v}" \
            --generate-notes
